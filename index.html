<style>
/* Layout: sticky top nav, one centered 1040px column, pages swap in place. Files are rows, subjects are tiles. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#14181f; --muted:#5c6572; --line:#e1e4ea;
  --accent:#2447d6; --accent-fg:#ffffff; --accent-soft:#e7ecfd; --ok:#17794a; --warn:#a4560a; --bad:#b3261e;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b23; --fg:#eceff4; --muted:#9aa4b2; --line:#2a303b;
  --accent:#7d97ff; --accent-fg:#0b1030; --accent-soft:#1e2745; --ok:#4cc38a; --warn:#e9a24f; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --fg:#eceff4; --muted:#9aa4b2; --line:#2a303b;
  --accent:#7d97ff; --accent-fg:#0b1030; --accent-soft:#1e2745; --ok:#4cc38a; --warn:#e9a24f; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.bar{max-width:1040px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;padding:0}
.mark{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.mark i{background:var(--accent);border-radius:2px}.mark i:nth-child(2){opacity:.55}.mark i:nth-child(3){opacity:.3}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav button:hover{color:var(--fg)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:40px 72px;display:flex;flex-direction:column;gap:40px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:700}
.hero p.lead{font-size:18px;color:var(--muted);margin-top:16px;max-width:52ch}
.hero .cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stats div{padding:18px;border-inline-start:1px solid var(--line)}.stats div:first-child{border-inline-start:0}
.stats b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.stats span{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:26px}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ext{font-family:var(--mono);font-size:11px;font-weight:500;width:52px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.row h3{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:2px}
.meta .tag{font-family:var(--mono);font-size:12px;color:var(--fg)}
.desc{color:var(--muted);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.here{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:var(--muted)}.here b{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.upl{display:inline-block;margin-inline-start:4px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 11px/1.4 var(--mono,ui-monospace,monospace);letter-spacing:.06em;vertical-align:1px}
.rate{display:flex;align-items:center;gap:2px 8px;margin-top:6px;flex-wrap:wrap}
.stars .s,.rv-h .s{color:var(--line);font-size:16px;line-height:1}.stars .s.on,.rv-h .s.on{color:var(--accent)}
.rate .rt{color:var(--muted);font-size:13px}
.rvs{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.rv{padding:8px 0}.rv+.rv{border-top:1px solid var(--line)}
.rv-h{display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap;font-size:14px}.rv-d{color:var(--muted);font-size:12px;margin-inline-start:auto}
.rv p{margin-top:4px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.rv-none{color:var(--muted);font-size:14px}
.rv-form{margin-top:10px;display:grid;gap:8px}
.rv-pick{display:flex;gap:2px}
.st{border:0;background:none;padding:2px 3px;font-size:24px;line-height:1;color:var(--line);cursor:pointer;border-radius:4px}.st.on,.st:hover{color:var(--accent)}
.rv-text{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical}
.rv-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rv-msg{color:var(--fg);font-size:13px;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:20px;margin-bottom:6px}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:10px}
.filters2{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
select:disabled,input:disabled{opacity:.55;cursor:not-allowed}
.lbl{font-weight:500;font-size:14px;margin-bottom:6px}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.choice button,.seg button{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice button b{font-family:var(--display);font-size:20px}.choice button span{color:var(--muted);font-size:13px}
.choice button[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex-direction:row;font-weight:500}
.row-act{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row-act .bar-prog{flex:1;min-width:120px}
.grp{display:flex;flex-direction:column;gap:10px}.grp h2{font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 14px;cursor:pointer;text-align:start}
.chip:hover{border-color:var(--accent)}.chip em{font-style:normal;font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}

input[type=text],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea{min-height:90px;resize:vertical}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
label small{font-weight:400;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:760px}
.form .full{grid-column:1/-1}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--surface);cursor:pointer;display:block}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.drop strong{display:block;font-family:var(--display);font-size:18px}
.drop span{color:var(--muted);font-size:13px}
.note{border:1px solid var(--line);border-inline-start:3px solid var(--warn);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:14px}
.note.ok{border-left-color:var(--ok)}.note.bad{border-left-color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:19px;overflow-wrap:anywhere}
.tile span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{border-top:2px solid var(--fg);padding-top:12px}
.step h3{font-size:18px;margin-bottom:4px}.step p{color:var(--muted);font-size:14px}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:14px}
.prose h2{font-size:24px;margin-top:14px}
.prose ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.pagehead h1{font-size:clamp(30px,5vw,44px)}.pagehead p{color:var(--muted);margin-top:10px;max-width:56ch}
.bar-prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar-prog i{display:block;height:100%;background:var(--accent);width:0}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:28px}
  .filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}.filters2{grid-template-columns:1fr 1fr}.filters2>:first-child{grid-column:1/-1}.tiles.two,.choice{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .row{grid-template-columns:44px minmax(0,1fr)}.ext{width:44px}
  .row .acts{grid-column:1/-1;justify-content:flex-start}
  .stats b{font-size:26px}.stats div{padding:14px 12px}
}
@media (prefers-reduced-motion:no-preference){.btn,.tile{transition:border-color .15s,background .15s}}

.tools{display:flex;align-items:center;gap:8px}
[lang="ar"] body,[lang="ar"] button,[lang="ar"] input,[lang="ar"] select,[lang="ar"] textarea{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif}
[lang="ar"] h1,[lang="ar"] h2,[lang="ar"] h3,[lang="ar"] .brand{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif;letter-spacing:0}
[lang="ar"] .eyebrow,[lang="ar"] .upl{letter-spacing:0;text-transform:none}
[lang="ar"] .upl{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif;font-size:12px}
[dir="rtl"] input[type=email],[dir="rtl"] input[type=password]{direction:ltr;text-align:right}
[dir="rtl"] .stars,[dir="rtl"] .rv-pick{direction:ltr}

.adm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}
.adm-k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.adm-k span{color:var(--muted);font-size:13px}.adm-k b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.15}.adm-k em{font-style:normal;color:var(--muted);font-size:12px}
.adm-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}.adm-card h2{font-size:18px;margin-bottom:10px}
.adm-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.adm-2 .adm-card{margin-top:16px}
.adm-legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}.adm-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-inline-end:6px}.adm-legend em{font-style:normal;margin-inline-start:auto}
.adm-bars{display:flex;flex-direction:column;gap:8px}.adm-b{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}.adm-bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adm-bt{height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden}.adm-bt i{display:block;height:100%;background:var(--accent);border-radius:5px}.adm-b b{font-variant-numeric:tabular-nums}
.adm-none{color:var(--muted);padding:18px 0}.adm-body{margin-top:16px}
.adm-tools{display:flex;gap:12px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:13px}.adm-tools input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

  /* Sign in / sign up UI */
  var css=document.createElement("style");css.textContent='#auth-dlg{border:1px solid var(--line);border-radius:14px;padding:22px;max-width:380px;width:calc(100% - 32px);background:var(--surface);color:var(--fg);font-family:inherit}#auth-dlg::backdrop{background:rgba(0,0,0,.45)}#auth-dlg h2{margin:0 0 4px;font-size:20px}#auth-dlg label{display:block;margin-top:12px;font-size:13px;color:var(--muted)}#auth-dlg input{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}#auth-dlg .row2{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}#auth-msg{margin-top:10px;font-size:13px;min-height:18px}#auth-btn{margin-inline-start:auto}#auth-dlg [hidden]{display:none!important}#auth-dlg small{display:block;margin-top:4px;color:var(--muted);font-size:12px}#auth-dlg .oauth{display:grid;gap:8px;margin-top:14px}#auth-dlg .oauth .btn{width:100%;justify-content:center}#auth-dlg .or{margin:12px 0 0;text-align:center;color:var(--muted);font-size:12px}';document.head.appendChild(css);

  function majorsPage(){
    var u=uni(S.majorsUni);
    return '<div class="pagehead"><h1>Majors</h1><p>Every programme listed on each university\'s website, with the number of files shared for it.</p></div>'+
    '<div class="seg" role="group" aria-label="University">'+UNIS.map(function(x){return '<button data-mu="'+x.id+'" aria-pressed="'+(x.id===S.majorsUni)+'">'+esc(x.name)+'</button>'}).join("")+'</div>'+
    u.groups.map(function(g){return '<section class="grp"><h2>'+esc(g.g)+'</h2><div class="chips">'+g.m.map(function(m){var n=count({uni:u.id,major:m});
      return '<button class="chip" data-major="'+esc(m)+'" data-u="'+u.id+'"><span>'+esc(m)+'</span><em>'+n+'</em></button>'}).join("")+'</div></section>'}).join("")
  }

  function subjectField(){
    if(!U.year)return '<label>5 · Subject<input type="text" id="ps" placeholder="Choose a year first" disabled></label>';
    var L=listed(U);
    if(!L.length)return '<label>5 · Subject <small>No official course list for this major yet. Type the course name and code.</small><input type="text" id="ps" list="subs" maxlength="80" placeholder="e.g. Course code and name" value="'+esc(U.subject)+'"><datalist id="subs">'+subjectsFor(U).map(function(x){return '<option value="'+esc(x[0])+'">'}).join("")+'</datalist></label>';
    var extras=subjectsFor(U).map(function(x){return x[0]}).filter(function(x){return L.indexOf(x)<0});
    var sel=U.other?'__other':(U.subject||'');
    var opts='<option value="">Choose your subject</option>'+L.concat(extras).map(function(k){return '<option value="'+esc(k)+'"'+(sel===k?' selected':'')+'>'+esc(k)+'</option>'}).join("")+'<option value="__other"'+(sel==='__other'?' selected':'')+'>Another subject (type it)</option>';
    return '<label>5 · Subject <small>From the '+esc(U.year)+' study plan</small><select id="psl">'+opts+'</select></label>'+(U.other?'<label class="full">Subject name<input type="text" id="ps" maxlength="80" placeholder="Course code and name" value="'+esc(U.subject)+'"></label>':'')
  }
  function locFields(){
    return '<div class="full"><div class="lbl">1 · University</div><div class="choice">'+UNIS.map(function(x){return '<button type="button" data-pu="'+x.id+'" aria-pressed="'+(U.uni===x.id)+'"><b>'+esc(x.short)+'</b><span>'+esc(x.name)+'</span></button>'}).join("")+'</div></div>'+
    '<label class="full">2 · '+(U.uni?unitWord(U.uni):'College / School')+'<select id="pc"'+(U.uni?'':' disabled')+'><option value="">'+(U.uni?'Choose your '+unitWord(U.uni).toLowerCase():'Choose a university first')+'</option>'+collegeOpts(U.uni,U.college)+'</select></label>'+
    '<label class="full">3 · Major<select id="pm"'+(U.college?'':' disabled')+'><option value="">'+(U.college?'Choose your major':'Choose a '+(U.uni?unitWord(U.uni).toLowerCase():'college')+' first')+'</option>'+majorOpts(U.uni,U.college,U.major)+'</select></label>'+
    '<label>4 · Year<select id="py"'+(U.major?'':' disabled')+'><option value="">'+(U.major?'Choose your year':'Choose a major first')+'</option>'+yearOpts(U.uni,U.year)+'</select></label>'
  }
  function lockedBar(){
    return '<div class="full here"><span>Adding to <b>'+esc(uni(U.uni).short)+' · '+esc(U.major)+' · '+esc(U.year)+(U.subject&&!U.other?' · '+esc(U.subject):'')+'</b></span><button type="button" class="btn small" data-unlock="1">Change</button></div>'
  }
  function uploadPage(){
    var m=S.msg,can=S.assets&&S.dbOk&&S.me,u=uni(U.uni);
    return '<div class="pagehead"><h1>Upload a file</h1><p>Tell us where it belongs so classmates in your course can find it. PDFs, images and text files up to 20 MB.</p></div>'+
    (!can&&S.loaded?(S.dbOk&&!S.me?'<div class="note">Sign in to upload files. <button class="btn small primary" data-auth="1">Sign in or sign up</button></div>':'<div class="note">Uploading is not available right now. Check that the hub is connected to Supabase.</div>'):'')+
    (m?'<div class="note '+(m.ok?'ok':'bad')+'" role="status">'+esc(m.text)+'</div>':'')+
    '<form class="form" id="upf" novalidate>'+
    (U.locked&&U.uni&&U.college&&U.major&&U.year?lockedBar()+(U.subject&&!U.other?'':subjectField()):locFields()+subjectField())+
    '<label class="full drop" id="drop" for="file"><input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.svg,.txt,.md,.csv"><strong id="dname">Choose a file or drop it here</strong><span id="dhint">PDF, PNG, JPG, TXT, MD or CSV</span></label>'+
    '<label class="full">Title<input type="text" id="pt" maxlength="120" placeholder="e.g. Week 4 lecture slides: Loops" value="'+esc(U.title)+'"></label>'+
    '<label>Type<select id="pk">'+KINDS.map(function(k){return '<option value="'+esc(k)+'"'+(U.kind===k?' selected':'')+'>'+k+'</option>'}).join("")+'</select></label>'+
    '<label class="full">Short description <small>Optional. Say what is covered and which week or exam.</small><textarea id="pd" maxlength="400">'+esc(U.desc)+'</textarea></label>'+
    '<div class="full row-act"><button class="btn primary" type="submit" id="go"'+(can?'':' disabled')+'>Share with classmates</button><div class="bar-prog" id="prog" hidden><i></i></div></div>'+
    '</form>'
  }

  function guidelines(){
    return '<div class="pagehead"><h1>Guidelines</h1><p>A few rules keep the hub useful for everyone.</p></div>'+
    '<div class="prose"><h2>What to share</h2><ul><li>Your own notes, summaries and slides.</li><li>Past papers your instructor already handed out.</li><li>Anything that helped you understand a topic.</li></ul>'+
    '<h2>What to leave out</h2><ul><li>Files with private information such as phone numbers or ID cards.</li><li>Copied textbooks or paid course material you do not have permission to share.</li><li>Graded work belonging to someone else.</li></ul>'+
    '<h2>Word and PowerPoint files</h2><p>The hub opens PDFs, images and text. Save your document as a PDF first, then upload it.</p><ul><li><b>Word:</b> File, then Save As, then choose PDF.</li><li><b>PowerPoint:</b> File, then Export, then Create PDF.</li><li><b>Google Docs or Slides:</b> File, then Download, then PDF document.</li></ul>'+
    '<h2>Name files clearly</h2><p>Put the topic and week in the title, for example "Week 4 slides: Loops". Write the subject the way your course lists it, with the course code, so it groups with everyone else\'s files.</p>'+
    '<h2>Where the lists come from</h2><p>Majors are taken from the website of each university: University of Bahrain, Bahrain Polytechnic, Ahlia, AUBH, Applied Science University, Arab Open University, Arabian Gulf University, British University of Bahrain, Euro University, Gulf University, Kingdom University, RCSI Bahrain, Royal University for Women, University College of Bahrain and University of Technology Bahrain. Subject lists by year come from the published study plans for University of Bahrain and some Bahrain Polytechnic programmes. For every other programme, type the subject and it appears for your classmates after that.</p></div>'
  }

  function render(){
    nav();
    var v=$("#view"),h;
    if(S.page==="library")h=library();else if(S.page==="upload")h=uploadPage();else if(S.page==="majors")h=majorsPage();else if(S.page==="guidelines")h=guidelines();else if(S.page==="admin"&&window.__adm&&window.__adm.ok)h=window.__adm.html();else h=home();
    v.innerHTML=h;
    if(S.page==="upload")bindUpload();
    if(S.page==="library")bindLibrary();
    if(S.page==="admin"&&window.__adm)window.__adm.bind();
  }
  function refreshData(){
    if(S.page==="admin")return;
    if(S.page==="upload"){nav();if(!S.loaded||true){var sd=$("#subs");if(sd&&U.year)sd.innerHTML=subjectsFor(U).map(function(s){return '<option value="'+esc(s[0])+'">'}).join("");var g=$("#go");if(g&&!picked)g.disabled=!(S.assets&&S.dbOk)}return}
    if(S.page==="library"){var l=$("#lib");if(l){l.innerHTML=libraryList();var fs=$("#fs");if(fs){fs.innerHTML='<option value="">All subjects</option>'+subjectsFor(S.filter).map(function(s){return '<option value="'+esc(s[0])+'"'+(S.filter.subject===s[0]?' selected':'')+'>'+esc(s[0])+(s[1]?' ('+s[1]+')':'')+'</option>'}).join("")}return}}
    render()
  }

  function pick(f){
    if(!f)return;var e=ext(f.name),hint=$("#dhint");
    if(/^(doc|docx|ppt|pptx|xls|xlsx|pages|key)$/.test(e)){picked=null;$("#dname").textContent="Save it as a PDF first";hint.textContent="Word and PowerPoint files are not supported. See Guidelines for the steps.";return}
    if(!OK_EXT[e]){picked=null;$("#dname").textContent="This file type is not supported";hint.textContent="Use PDF, PNG, JPG, TXT, MD or CSV.";return}
    if(f.size>20*1048576){picked=null;$("#dname").textContent="File is over 20 MB";hint.textContent="Compress it or split it into parts.";return}
    picked=f;$("#dname").textContent=f.name;hint.textContent=size(f.size);
    var t=$("#pt");if(!t.value){t.value=U.title=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ")}
  }
  function bindUpload(){
    var drop=$("#drop"),inp=$("#file");
    if(picked){$("#dname").textContent=picked.name;$("#dhint").textContent=size(picked.size)}
    inp.addEventListener("change",function(){pick(inp.files[0])});
    ["dragenter","dragover"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add("over")})});
    ["dragleave","drop"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove("over")})});
    drop.addEventListener("drop",function(e){if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0])});
    var pcs=$("#pc");if(pcs)pcs.addEventListener("change",function(e){U.college=e.target.value;U.major=U.year=U.subject="";U.other=false;render()});
    var pms=$("#pm");if(pms)pms.addEventListener("change",function(e){U.major=e.target.value;U.year=U.subject="";U.other=false;render()});
    var pys=$("#py");if(pys)pys.addEventListener("change",function(e){U.year=e.target.value;U.subject="";U.other=false;render()});
    var ps=$("#ps");if(ps)ps.addEventListener("input",function(e){U.subject=e.target.value});
    var psl=$("#psl");if(psl)psl.addEventListener("change",function(e){var v=e.target.value;if(v==="__other"){U.other=true;U.subject=""}else{U.other=false;U.subject=v}render()});
    $("#pt").addEventListener("input",function(e){U.title=e.target.value});
    $("#pk").addEventListener("change",function(e){U.kind=e.target.value});
    $("#pd").addEventListener("input",function(e){U.desc=e.target.value});
    $("#upf").addEventListener("submit",function(e){e.preventDefault();submit()})
  }
  function say(ok,text){S.msg={ok:ok,text:text};render();window.scrollTo(0,0)}
  function showToast(text){
    var o=document.getElementById("toast");if(o)o.remove();
    var d=document.createElement("div");d.id="toast";d.className="toast";d.setAttribute("role","status");
    d.innerHTML='<i class="tick" aria-hidden="true">✓</i><div><b>Upload successful</b><span></span></div><button type="button" aria-label="Close">×</button>';
    d.querySelector("span").textContent=text;
    d.querySelector("button").onclick=function(){d.remove()};
    document.body.appendChild(d);
    setTimeout(function(){if(d.parentNode)d.remove()},7000)
  }
  async function submit(){
    if(!S.assets||!S.dbOk)return;
    var subj=U.subject.trim(),title=U.title.trim();
    if(!U.uni){say(false,"Choose your university first.");return}
    if(!U.college){say(false,"Choose your college or school.");return}
    if(!U.major){say(false,"Choose your major.");return}
    if(!U.year){say(false,"Choose your year.");return}
    if(!subj){say(false,"Enter the subject, for example the course name and code.");return}
    if(!picked){say(false,"Choose a file to upload.");return}
    if(!title){say(false,"Give the file a title so classmates can find it.");return}
    var btn=$("#go");btn.disabled=true;btn.textContent="Uploading…";$("#prog").hidden=false;$("#prog i").style.width="60%";
    try{
      var e=ext(picked.name),a=await S.assets.upload(picked,{type:OK_EXT[e]});
      await S.db.collection("files").add({title:title,uni:U.uni,college:U.college,major:U.major,year:U.year,subject:subj,kind:U.kind,description:U.desc.trim(),assetId:a.id,contentType:a.contentType,sizeBytes:a.sizeBytes,fileName:picked.name,uploaderId:S.me||"",createdAt:Date.now()});
      var okText="Shared. Classmates in "+U.major+", "+U.year+" can now find \""+title+"\" in the Library.";
      picked=null;S.filter={uni:U.uni,college:U.college,major:U.major,year:U.year,subject:subj,kind:"",q:"",sort:"new"};U.title=U.subject=U.desc="";U.locked=false;
      S.msg=null;S.page="library";try{history.replaceState(null,"","#library")}catch(e){}render();window.scrollTo(0,0);
      showToast(okText)
    }catch(err){
      var c=err&&err.code,t="The upload did not finish. Try again in a moment.";
      if(c==="quota_exceeded"||c==="quota")t="The hub is out of storage space.";
      else if(c==="not_granted"||c==="invalid_argument"||c==="not_signed_in"||c==="42501")t="Please sign in to upload.";
      else if(c==="unsupported_type")t="This file type is not accepted. Use a PDF, image or text file.";
      say(false,t)
    }
  }
  function rid(fid){return String(fid+"_"+S.me).replace(/[^A-Za-z0-9_.~:@+-]/g,"_").slice(0,190)}
  function rmsg(fid,t){var m=document.querySelector('[data-rmsg="'+fid+'"]');if(m)m.textContent=t}
  async function saveReview(fid){
    var d=S.draft[fid];if(!S.db||!S.me||!d)return;
    if(!d.stars){rmsg(fid,"Pick 1 to 5 stars first.");return}
    rmsg(fid,"Saving…");
    try{await S.db.doc("ratings/"+rid(fid)).set({fileId:fid,userId:S.me,stars:d.stars,text:(d.text||"").trim().slice(0,500),at:Date.now()});delete S.draft[fid];relib()}
    catch(e){rmsg(fid,"Could not save ("+((e&&e.code)||"error")+"). Are you signed in?")}
  }
  async function delReview(fid){
    try{await S.db.doc("ratings/"+rid(fid)).delete();delete S.draft[fid];relib()}catch(e){rmsg(fid,"Could not remove.")}
  }
  function relib(){if(S.page==="library"){var l=$("#lib");if(l)l.innerHTML=libraryList()}else if(S.page==="home")render()}
  async function remove(id){
    var f=S.files.filter(function(x){return x.id===id})[0];if(!f)return;
    var btn=document.querySelector('[data-del="'+id+'"]');
    if(btn&&btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent="Click again to remove";setTimeout(function(){if(btn){btn.dataset.sure="";btn.textContent="Remove"}},4000);return}
    try{await S.db.doc("files/"+id).delete();try{await S.assets.delete(f.assetId)}catch(e){}}catch(e){if(btn)btn.textContent="Could not remove"}
  }

  document.addEventListener("input",function(e){var t=e.target;if(t.matches&&t.matches(".rv-text")){var f=t.getAttribute("data-rt");(S.draft[f]=S.draft[f]||{stars:0,text:""}).text=t.value}});
  document.addEventListener("focusout",function(e){if(e.target.matches&&e.target.matches(".rv-text")&&S.stale){S.stale=false;setTimeout(relib,0)}});
  function typing(){var a=document.activeElement;return !!(a&&a.classList&&a.classList.contains("rv-text"))}
  document.addEventListener("click",function(e){
    var t=e.target;
    var g=t.closest("[data-go]");if(g){if(g.getAttribute("data-go")==="upload")U.locked=false;go(g.getAttribute("data-go"));return}
    var un=t.closest("[data-uni]");if(un){S.filter={uni:un.getAttribute("data-uni"),college:"",major:"",year:"",subject:"",kind:"",q:"",sort:"new"};go("library");return}
    var mu=t.closest("[data-mu]");if(mu){S.majorsUni=mu.getAttribute("data-mu");render();return}
    var mj=t.closest("[data-major]");if(mj){S.filter={uni:mj.getAttribute("data-u"),college:collegeOf(mj.getAttribute("data-u"),mj.getAttribute("data-major")),major:mj.getAttribute("data-major"),year:"",subject:"",kind:"",q:"",sort:"new"};go("library");return}
    var pu=t.closest("[data-pu]");if(pu){var id=pu.getAttribute("data-pu");if(U.uni!==id){U.uni=id;U.college=U.major=U.year=U.subject="";U.other=false}render();return}
    if(t.closest("[data-unlock]")){U.locked=false;render();return}
    if(t.closest("[data-here]")){var F=S.filter;U.locked=true;U.uni=F.uni;U.college=F.college;U.major=F.major;U.year=F.year;U.subject=F.subject||"";U.other=false;go("upload");return}
    var rv=t.closest("[data-rv]");if(rv){var i0=rv.getAttribute("data-rv");S.open[i0]=!S.open[i0];relib();return}
    var rs=t.closest("[data-rs]");if(rs){var p=rs.getAttribute("data-rs").split(":");(S.draft[p[0]]=S.draft[p[0]]||{stars:0,text:""}).stars=+p[1];relib();return}
    var sv=t.closest("[data-rsave]");if(sv){saveReview(sv.getAttribute("data-rsave"));return}
    var dl=t.closest("[data-rdel]");if(dl){delReview(dl.getAttribute("data-rdel"));return}
    var d=t.closest("[data-del]");if(d){remove(d.getAttribute("data-del"))}
  });

  async function loadNames(){
    if(!S.user||!S.user.profiles)return;
    var ids=[],seen={};var add=function(u){if(u&&!seen[u]&&!S.names[u]){seen[u]=1;ids.push(u)}};S.files.forEach(function(f){add(f.uploaderId)});Object.keys(S.ratings).forEach(function(k){Object.keys(S.ratings[k]).forEach(add)});
    if(!ids.length)return;
    try{var ps=await S.user.profiles(ids);ids.forEach(function(i){var n=ps[i]&&ps[i].name;if(n)S.names[i]=n});if(typing())S.stale=true;else refreshData()}catch(e){}
  }
  async function init(){
    window.__sh={render:render,go:go,UNIS:UNIS,COURSES:COURSES,S:S};
    var h="";try{h=(location.hash||"").slice(1)}catch(e){}
    if(PAGES.some(function(p){return p[0]===h}))S.page=h;
    render();
    try{
      var c=window.claude;if(!c||!c.use){S.loaded=true;S.dbOk=false;render();return}
      S.user=await c.use("user");
      if(S.user){try{S.me=await S.user.id()}catch(e){}try{S.canEdit=!!S.user.canEdit()}catch(e){}}
      S.assets=await c.use("assets");
      S.db=await c.use("db");
      if(!S.db){S.loaded=true;S.dbOk=false;render();return}
      S.dbOk=true;
      try{S.db.collection("ratings").limit(1000).onSnapshot(function(snap){
        var m={};snap.docs.forEach(function(d){var o=d.data()||{};if(o.fileId&&o.userId&&o.stars>=1&&o.stars<=5){(m[o.fileId]=m[o.fileId]||{})[o.userId]={stars:o.stars,text:o.text||"",at:o.at||0}}});
        S.ratings=m;if(S.loaded){if(typing())S.stale=true;else relib()}loadNames()
      },function(){})}catch(e){}
      S.db.collection("files").orderBy("createdAt","desc").limit(500).onSnapshot(function(snap){
        S.files=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
        S.loaded=true;if(typing())S.stale=true;else refreshData();loadNames()
      },function(){S.loaded=true;S.dbOk=false;refreshData()})
    }catch(e){S.loaded=true;S.dbOk=false;render()}
  }
  init()
})();
</script>

  var UNITS={"colleges":["كليات","كلية","كليتان","كلية"],"schools":["مدارس","مدرسة","مدرستان","مدرسة"],"faculties":["كليات","كلية","كليتان","كلية"],"departments":["أقسام","قسم","قسمان","قسمًا"]};
  function cnt(n,w){return n===1?"1 "+w[1]:n===2?w[2]:n===0?"0 "+w[0]:(n>=3&&n<=10?n+" "+w[0]:n+" "+w[3])}
  var lang="en",busy=false;
  function base(s){return Object.prototype.hasOwnProperty.call(AR,s)?AR[s]:null}
  function tr(s){
    var t=s.trim();if(!t)return s;
    var lead=s.slice(0,s.indexOf(t)),tail=s.slice(s.indexOf(t)+t.length),r=core(t);
    return r===null||r===t?s:lead+r+tail
  }
  function core(t){
    var b=base(t),m;if(b!==null)return b;
    if(m=/^(\d+) (colleges|schools|faculties|departments) · (\d+) programmes · (\d+) files?$/.exec(t))return cnt(+m[1],UNITS[m[2]])+" · "+cnt(+m[3],["برامج","برنامج","برنامجان","برنامجًا"])+" · "+cnt(+m[4],["ملفات","ملف","ملفان","ملفًا"]);
    if(m=/^Year (\d+)$/.exec(t))return "السنة "+m[1];
    if(m=/^([\d.]+) out of 5$/.exec(t))return m[1]+" من 5";
    if(m=/^(\d+) stars?$/.exec(t))return m[1]+(m[1]==="1"?" نجمة":" نجوم");
    if(m=/^(\d+) (min|h|d) ago$/.exec(t)){var W={min:["دقيقة","دقيقتين","دقائق","دقيقة"],h:["ساعة","ساعتين","ساعات","ساعة"],d:["يوم","يومين","أيام","يومًا"]}[m[2]],n=+m[1];return "منذ "+(n===1?W[0]:n===2?W[1]:n<=10?n+" "+W[2]:n+" "+W[3])}
    if(m=/^(\d+) reviews?$/.exec(t))return cnt(+m[1],["تقييمات","تقييم","تقييمان","تقييمًا"]);
    if(m=/^Sign out \((.*)\)$/.exec(t))return "تسجيل الخروج ("+(base(m[1])||m[1])+")";
    if(m=/^From the (Year \d+) study plan$/.exec(t))return "من الخطة الدراسية لـ"+core(m[1]);
    if(m=/^Shared\. Classmates in (.*), (Year \d+) can now find "(.*)" in the Library\.$/.exec(t))return "تمت المشاركة. يمكن لزملائك في "+m[1]+"، "+core(m[2])+" العثور على «"+m[3]+"» في المكتبة الآن.";
    if(m=/^Could not save \((.*)\)\. Reviewing needs contributor access\.$/.exec(t))return "تعذّر الحفظ ("+m[1]+"). كتابة التقييم تتطلب تسجيل الدخول.";
    if(t.indexOf(" · ")>-1){var p=t.split(" · "),ch=false,o=p.map(function(x){var y=core(x);if(y!==null&&y!==x){ch=true;return y}return x});return ch?o.join(" · "):null}
    if(m=/^(\d+) (.+)$/.exec(t)){var y=core(m[2]);if(y!==null&&y!==m[2])return m[1]+" "+y}
    return null
  }
  var ATTRS=["placeholder","aria-label","title"];
  function doText(n){
    var p=n.parentNode;if(!p)return;var tg=p.nodeName;if(tg==="SCRIPT"||tg==="STYLE"||tg==="TEXTAREA")return;
    var v=n.nodeValue;
    if(n.__t!==undefined&&v===n.__t)return;
    if(lang==="ar"){var r=tr(v);n.__o=v;n.__t=r;if(r!==v)n.nodeValue=r}else{n.__t=undefined}
  }
  function doAttrs(el){
    ATTRS.forEach(function(a){
      if(!el.hasAttribute||!el.hasAttribute(a))return;
      var k="__a_"+a,v=el.getAttribute(a);
      if(el[k]&&el[k].t===v)return;
      if(lang==="ar"){var r=tr(v);el[k]={o:v,t:r};if(r!==v)el.setAttribute(a,r)}else el[k]=null
    })
  }
  function walk(root){
    if(root.nodeType===3){doText(root);return}
    if(root.nodeType!==1)return;
    if(root.nodeName==="SCRIPT"||root.nodeName==="STYLE")return;
    doAttrs(root);
    for(var c=root.firstChild;c;c=c.nextSibling)walk(c)
  }
  function restore(root){
    if(root.nodeType===3){if(root.__t!==undefined&&root.__o!==undefined&&root.nodeValue===root.__t)root.nodeValue=root.__o;root.__t=undefined;return}
    if(root.nodeType!==1)return;
    ATTRS.forEach(function(a){var k="__a_"+a;if(root[k]&&root.getAttribute(a)===root[k].t)root.setAttribute(a,root[k].o);root[k]=null});
    for(var c=root.firstChild;c;c=c.nextSibling)restore(c)
  }
  var mo=new MutationObserver(function(list){
    if(busy||lang!=="ar")return;busy=true;
    try{list.forEach(function(m){
      if(m.type==="childList")m.addedNodes.forEach(walk);
      else if(m.type==="characterData")doText(m.target);
      else if(m.type==="attributes")doAttrs(m.target)
    })}finally{busy=false}
  });
  function set(l,save){
    var root=document.documentElement;
    if(l==="ar"){lang="ar";root.setAttribute("lang","ar");root.setAttribute("dir","rtl");walk(document.body)}
    else{busy=true;restore(document.body);busy=false;lang="en";root.setAttribute("lang","en");root.setAttribute("dir","ltr")}
    var b=document.getElementById("langbtn");if(b){b.textContent=l==="ar"?"English":"عربي";b.setAttribute("aria-label",l==="ar"?"Switch to English":"التبديل إلى العربية")}
    document.title=l==="ar"?"مركز الدراسة":(document.title==="مركز الدراسة"?"Study Hub":document.title);
    if(save){try{localStorage.setItem("sh_lang",l)}catch(e){}}
  }
  function setup(){
    var bar=document.querySelector(".bar");
    var b=document.createElement("button");b.id="langbtn";b.type="button";b.className="btn small";b.textContent="عربي";
    b.onclick=function(){set(lang==="ar"?"en":"ar",true)};
    var nav=document.getElementById("nav");
    var wrap=document.createElement("div");wrap.className="tools";
    if(nav&&nav.parentNode===bar){bar.insertBefore(wrap,nav.nextSibling)}else bar.appendChild(wrap);
    wrap.appendChild(b);
    mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS});
    var l="en";try{l=localStorage.getItem("sh_lang")||""}catch(e){}
    if(!l){try{l=/^ar/i.test(navigator.language||"")?"ar":"en"}catch(e){l="en"}}
    set(l==="ar"?"ar":"en",false);
    var ab=document.getElementById("auth-btn");if(ab)wrap.appendChild(ab);
    window.__shLang=function(x){set(x,true)}
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",setup);else setup()
})();
