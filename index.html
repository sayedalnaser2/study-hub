<style>
/* Layout: sticky top nav, one centered 1040px column, pages swap in place. Files are rows, subjects are tiles. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#14181f; --muted:#5c6572; --line:#e1e4ea;
  --accent:#2447d6; --accent-fg:#ffffff; --accent-soft:#e7ecfd; --ok:#17794a; --warn:#a4560a; --bad:#b3261e;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b23; --fg:#eceff4; --muted:#9aa4b2; --line:#2a303b;
  --accent:#7d97ff; --accent-fg:#0b1030; --accent-soft:#1e2745; --ok:#4cc38a; --warn:#e9a24f; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --fg:#eceff4; --muted:#9aa4b2; --line:#2a303b;
  --accent:#7d97ff; --accent-fg:#0b1030; --accent-soft:#1e2745; --ok:#4cc38a; --warn:#e9a24f; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.bar{max-width:1040px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;padding:0}
.mark{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.mark i{background:var(--accent);border-radius:2px}.mark i:nth-child(2){opacity:.55}.mark i:nth-child(3){opacity:.3}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav button:hover{color:var(--fg)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:40px 72px;display:flex;flex-direction:column;gap:40px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:700}
.hero p.lead{font-size:18px;color:var(--muted);margin-top:16px;max-width:52ch}
.hero .cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stats div{padding:18px;border-inline-start:1px solid var(--line)}.stats div:first-child{border-inline-start:0}
.stats b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.stats span{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:26px}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ext{font-family:var(--mono);font-size:11px;font-weight:500;width:52px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.row h3{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:2px}
.meta .tag{font-family:var(--mono);font-size:12px;color:var(--fg)}
.desc{color:var(--muted);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.here{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:var(--muted)}.here b{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.upl{display:inline-block;margin-inline-start:4px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 11px/1.4 var(--mono,ui-monospace,monospace);letter-spacing:.06em;vertical-align:1px}
.rate{display:flex;align-items:center;gap:2px 8px;margin-top:6px;flex-wrap:wrap}
.stars .s,.rv-h .s{color:var(--line);font-size:16px;line-height:1}.stars .s.on,.rv-h .s.on{color:var(--accent)}
.rate .rt{color:var(--muted);font-size:13px}
.rvs{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.rv{padding:8px 0}.rv+.rv{border-top:1px solid var(--line)}
.rv-h{display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap;font-size:14px}.rv-d{color:var(--muted);font-size:12px;margin-inline-start:auto}
.rv p{margin-top:4px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.rv-none{color:var(--muted);font-size:14px}
.rv-form{margin-top:10px;display:grid;gap:8px}
.rv-pick{display:flex;gap:2px}
.st{border:0;background:none;padding:2px 3px;font-size:24px;line-height:1;color:var(--line);cursor:pointer;border-radius:4px}.st.on,.st:hover{color:var(--accent)}
.rv-text{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical}
.rv-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rv-msg{color:var(--fg);font-size:13px;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:20px;margin-bottom:6px}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:10px}
.filters2{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
select:disabled,input:disabled{opacity:.55;cursor:not-allowed}
.lbl{font-weight:500;font-size:14px;margin-bottom:6px}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.choice button,.seg button{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice button b{font-family:var(--display);font-size:20px}.choice button span{color:var(--muted);font-size:13px}
.choice button[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex-direction:row;font-weight:500}
.row-act{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row-act .bar-prog{flex:1;min-width:120px}
.grp{display:flex;flex-direction:column;gap:10px}.grp h2{font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 14px;cursor:pointer;text-align:start}
.chip:hover{border-color:var(--accent)}.chip em{font-style:normal;font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}

input[type=text],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea{min-height:90px;resize:vertical}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
label small{font-weight:400;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:760px}
.form .full{grid-column:1/-1}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--surface);cursor:pointer;display:block}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.drop strong{display:block;font-family:var(--display);font-size:18px}
.drop span{color:var(--muted);font-size:13px}
.note{border:1px solid var(--line);border-inline-start:3px solid var(--warn);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:14px}
.note.ok{border-left-color:var(--ok)}.note.bad{border-left-color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:19px;overflow-wrap:anywhere}
.tile span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{border-top:2px solid var(--fg);padding-top:12px}
.step h3{font-size:18px;margin-bottom:4px}.step p{color:var(--muted);font-size:14px}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:14px}
.prose h2{font-size:24px;margin-top:14px}
.prose ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.pagehead h1{font-size:clamp(30px,5vw,44px)}.pagehead p{color:var(--muted);margin-top:10px;max-width:56ch}
.bar-prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar-prog i{display:block;height:100%;background:var(--accent);width:0}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:28px}
  .filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}.filters2{grid-template-columns:1fr 1fr}.filters2>:first-child{grid-column:1/-1}.tiles.two,.choice{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .row{grid-template-columns:44px minmax(0,1fr)}.ext{width:44px}
  .row .acts{grid-column:1/-1;justify-content:flex-start}
  .stats b{font-size:26px}.stats div{padding:14px 12px}
}
@media (prefers-reduced-motion:no-preference){.btn,.tile{transition:border-color .15s,background .15s}}

.tools{display:flex;align-items:center;gap:8px}
[lang="ar"] body,[lang="ar"] button,[lang="ar"] input,[lang="ar"] select,[lang="ar"] textarea{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif}
[lang="ar"] h1,[lang="ar"] h2,[lang="ar"] h3,[lang="ar"] .brand{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif;letter-spacing:0}
[lang="ar"] .eyebrow,[lang="ar"] .upl{letter-spacing:0;text-transform:none}
[lang="ar"] .upl{font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif;font-size:12px}
[dir="rtl"] input[type=email],[dir="rtl"] input[type=password]{direction:ltr;text-align:right}
[dir="rtl"] .stars,[dir="rtl"] .rv-pick{direction:ltr}

.adm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}
.adm-k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.adm-k span{color:var(--muted);font-size:13px}.adm-k b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.15}.adm-k em{font-style:normal;color:var(--muted);font-size:12px}
.adm-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}.adm-card h2{font-size:18px;margin-bottom:10px}
.adm-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.adm-2 .adm-card{margin-top:16px}
.adm-legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}.adm-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-inline-end:6px}.adm-legend em{font-style:normal;margin-inline-start:auto}
.adm-bars{display:flex;flex-direction:column;gap:8px}.adm-b{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}.adm-bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adm-bt{height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden}.adm-bt i{display:block;height:100%;background:var(--accent);border-radius:5px}.adm-b b{font-variant-numeric:tabular-nums}
.adm-none{color:var(--muted);padding:18px 0}.adm-body{margin-top:16px}
.adm-tools{display:flex;gap:12px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:13px}.adm-tools input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.adm-row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}.adm-row>div:first-child{min-width:0;display:flex;flex-direction:column;gap:2px}.adm-row span{color:var(--muted);font-size:13px}.adm-row p{margin-top:4px;font-size:14px}
.adm-a{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.adm-ban,.adm-me{display:inline-block;padding:1px 7px;border-radius:6px;font:600 11px/1.5 var(--mono);letter-spacing:.06em;vertical-align:1px}.adm-ban{background:var(--bad);color:var(--surface)}.adm-me{background:var(--accent-soft);color:var(--accent)}
.adm-tabs{flex-wrap:wrap}.adm-note{color:var(--muted);font-size:13px;margin:0 0 10px}.adm-note code{font-family:var(--mono);font-size:12px}
.adm-tag{align-self:flex-start;font:600 11px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px}.adm-tx{color:var(--fg)!important;font-size:14px!important}.adm-when{color:var(--muted);font-size:12px;white-space:nowrap}
.adm-meter{height:14px;border-radius:7px;background:var(--accent-soft);overflow:hidden;margin-bottom:10px}.adm-meter i{display:block;height:100%;background:var(--accent)}.adm-meter.warn i{background:var(--warn)}.adm-meter.bad i{background:var(--bad)}
.adm-h3{font-size:15px;margin:14px 0 8px}.adm-off{color:var(--muted);cursor:default}.adm-x{border:0;background:none;cursor:pointer;color:var(--bad);font-size:16px;line-height:1;padding:0 2px}
.adm-form{display:flex;flex-direction:column;gap:10px;max-width:520px}.adm-form label,#sh-dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.adm-form input,.adm-form textarea,#adm-cs,#sh-dlg input,#sh-dlg select,#sh-dlg textarea,.adm-casc select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.adm-chk{flex-direction:row!important;align-items:center;gap:8px!important}.adm-chk input{width:auto}.adm-msg{font-size:13px;min-height:18px;color:var(--muted)}
.adm-casc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}.adm-casc label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}#adm-cs{width:100%}

  var ORDK=["uni","college","major","year","subject"],ORDL=["u","c","m","y","s"];

  var LAST=null;try{LAST=JSON.parse(localStorage.getItem("sh_last")||"null")}catch(e){LAST=null}
  function lastParts(kind){var T=tgt(kind),p=[],a=[];if(!SCH())a.push(T.uni);a.push(T.college,T.major,T.year);if(kind==="lib"){if(T.subject)a.push(T.subject)}else if(U.locked&&U.subject&&!U.other)a.push(U.subject);

  function lastOk(){if(!LAST||LAST.l!==LEVEL||!LAST.p||LAST.p.length<(SCH()?3:4))return false;var p=LAST.p,i=0,u=SCH()?"school":p[i++],x=uni(u);if(!x||(SCH()!==(u==="school")))return false;
    var c=p[i++],m=p[i++],y=p[i++];return x.groups.some(function(g){return g.g===c&&g.m.indexOf(m)>-1})&&x.years.indexOf(y)>-1}
  function contBlock(){

  function stBtn(kind,lv,v,label,extra,cls){return '<button type="button" class="stp'+(cls?' '+cls:'')+'" data-st="'+lv+'" data-k="'+kind+'" data-v="'+esc(v)+'"><span>'+esc(label)+'</span>'+(extra||"")+'</button>'}

    (m?'<div class="note '+(m.ok?'ok':'bad')+'" role="status">'+esc(m.text)+'</div>':'')+
    '<form class="form" id="upf" novalidate>'+
    (U.locked&&U.uni&&U.college&&U.major&&U.year?lockedBar()+(U.subject&&!U.other?'':subjectField()):locFields()+subjectField())+
    '<label class="full drop" id="drop" for="file"><input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.svg,.txt,.md,.csv"><strong id="dname">Choose a file or drop it here</strong><span id="dhint">PDF, PNG, JPG, TXT, MD or CSV</span></label>'+

    '</form>'
  }

  function guidelines(){
    return '<div class="pagehead"><h1>Guidelines</h1><p>A few rules keep the hub useful for everyone.</p></div>'+
    '<div class="prose"><h2>What to share</h2><ul><li>Your own notes, summaries and slides.</li><li>Past papers your instructor already handed out.</li><li>Anything that helped you understand a topic.</li></ul>'+
    '<h2>What to leave out</h2><ul><li>Files with private information such as phone numbers or ID cards.</li><li>Copied textbooks or paid course material you do not have permission to share.</li><li>Graded work belonging to someone else.</li></ul>'+
    '<h2>Word and PowerPoint files</h2><p>The hub opens PDFs, images and text. Save your document as a PDF first, then upload it.</p><ul><li><b>Word:</b> File, then Save As, then choose PDF.</li><li><b>PowerPoint:</b> File, then Export, then Create PDF.</li><li><b>Google Docs or Slides:</b> File, then Download, then PDF document.</li></ul>'+
    '<h2>Name files clearly</h2><p>Put the topic and week in the title, for example "Week 4 slides: Loops". Write the subject the way your course lists it, with the course code, so it groups with everyone else\'s files.</p>'+
    '<h2>Where the lists come from</h2><p>Majors are taken from the website of each university: University of Bahrain, Bahrain Polytechnic, Ahlia, AUBH, Applied Science University, Arab Open University, Arabian Gulf University, British University of Bahrain, Euro University, Gulf University, Kingdom University, RCSI Bahrain, Royal University for Women, University College of Bahrain and University of Technology Bahrain. Subject lists by year come from the published study plans for University of Bahrain and some Bahrain Polytechnic programmes. For every other programme, type the subject and it appears for your classmates after that.</p></div>'
  }

  function render(){
    nav();
    var v=$("#view"),h;
    if(S.page==="library")h=library();else if(S.page==="upload")h=uploadPage();else if(S.page==="majors")h=majorsPage();else if(S.page==="guidelines")h=guidelines();else if(S.page==="mine"&&window.__mine)h=window.__mine.html();else if(S.page==="admin"&&window.__adm&&window.__adm.ok)h=window.__adm.html();else h=home();
    v.innerHTML=h;
    if(S.page==="upload")bindUpload();
    if(S.page==="mine"&&window.__mine)window.__mine.bind();
    if(S.page==="library")bindLibrary();
    if(S.page==="admin"&&window.__adm)window.__adm.bind();
  }
  function refreshData(){
    if(S.page==="admin")return;
    if(S.page==="upload"){nav();if(!S.loaded||true){var sd=$("#subs");if(sd&&U.year)sd.innerHTML=subjectsFor(U).map(function(s){return '<option value="'+esc(s[0])+'">'}).join("");var g=$("#go");if(g&&!picked)g.disabled=!(S.assets&&S.dbOk)}return}

    render()
  }

  function stPick(b){
    var kind=b.getAttribute("data-k"),lv=b.getAttribute("data-st"),v=b.getAttribute("data-v"),T=tgt(kind),i=ORDL.indexOf(lv);
    for(var j=i+1;j<5;j++)T[ORDK[j]]="";
    if(lv==="s"){
      if(kind==="lib"){if(v==="__all"){S.libFiles=true;T.subject=""}else T.subject=v}
      else{U.locked=true;if(v==="__other"){U.other=true;U.subject=""}else{U.other=false;U.subject=v}}
    }else{T[ORDK[i]]=v;if(kind==="lib"){S.libFiles=false;T.q=""}else{U.locked=false;U.other=false}}
    stGo(kind)
  }
  document.addEventListener("input",function(e){var q=e.target;if(q.classList&&q.classList.contains("stq")){var v=q.value.trim().toLowerCase(),l=q.parentNode.querySelector("[data-list]");if(l)Array.prototype.forEach.call(l.children,function(c){c.style.display=!v||c.textContent.toLowerCase().indexOf(v)>-1?"":"none"})}});
  function pick(f){
    if(!f)return;var e=ext(f.name),hint=$("#dhint");
    if(/^(doc|docx|ppt|pptx|xls|xlsx|pages|key)$/.test(e)){picked=null;$("#dname").textContent="Save it as a PDF first";hint.textContent="Word and PowerPoint files are not supported. See Guidelines for the steps.";return}
    if(!OK_EXT[e]){picked=null;$("#dname").textContent="This file type is not supported";hint.textContent="Use PDF, PNG, JPG, TXT, MD or CSV.";return}
    if(f.size>20*1048576){picked=null;$("#dname").textContent="File is over 20 MB";hint.textContent="Compress it or split it into parts.";return}
    picked=f;$("#dname").textContent=f.name;hint.textContent=size(f.size);
    var t=$("#pt");if(!t.value){t.value=U.title=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ")}
  }
  function bindUpload(){
    var drop=$("#drop"),inp=$("#file");if(!inp)return;
    if(picked){$("#dname").textContent=picked.name;$("#dhint").textContent=size(picked.size)}
    if(!$("#cmpbox")){var cb=document.createElement("div");cb.id="cmpbox";cb.className="full cmpbox";cb.innerHTML='<label for="cmpchk"><input type="checkbox" id="cmpchk"><span><b>Reduce file size</b> <span>(recommended)</span></span></label><small>Shrinks big scanned pages and photos before upload. Text stays searchable.</small>';drop.parentNode.insertBefore(cb,drop.nextSibling);
      var ck=cb.querySelector("input");ck.checked=U.cmp!==false;ck.addEventListener("change",function(){U.cmp=ck.checked})}
    inp.addEventListener("change",function(){pick(inp.files[0])});
    ["dragenter","dragover"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add("over")})});
    ["dragleave","drop"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove("over")})});
    drop.addEventListener("drop",function(e){if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0])});
    var pcs=$("#pc");if(pcs)pcs.addEventListener("change",function(e){U.college=e.target.value;U.major=U.year=U.subject="";U.other=false;render()});
    var pms=$("#pm");if(pms)pms.addEventListener("change",function(e){U.major=e.target.value;U.year=U.subject="";U.other=false;render()});
    var pys=$("#py");if(pys)pys.addEventListener("change",function(e){U.year=e.target.value;U.subject="";U.other=false;render()});
    var ps=$("#ps");if(ps)ps.addEventListener("input",function(e){U.subject=e.target.value});
    var psl=$("#psl");if(psl)psl.addEventListener("change",function(e){var v=e.target.value;if(v==="__other"){U.other=true;U.subject=""}else{U.other=false;U.subject=v}render()});
    $("#pt").addEventListener("input",function(e){U.title=e.target.value});
    $("#pk").addEventListener("change",function(e){U.kind=e.target.value});
    $("#pd").addEventListener("input",function(e){U.desc=e.target.value});
    $("#upf").addEventListener("submit",function(e){e.preventDefault();submit()})
  }
  function say(ok,text){S.msg={ok:ok,text:text};render();window.scrollTo(0,0)}
  function showToast(text){
    var o=document.getElementById("toast");if(o)o.remove();
    var d=document.createElement("div");d.id="toast";d.className="toast";d.setAttribute("role","status");
    d.innerHTML='<i class="tick" aria-hidden="true">✓</i><div><b>Upload successful</b><span></span></div><button type="button" aria-label="Close">×</button>';
    d.querySelector("span").textContent=text;
    d.querySelector("button").onclick=function(){d.remove()};
    document.body.appendChild(d);
    setTimeout(function(){if(d.parentNode)d.remove()},7000)
  }
  async function submit(){
    if(!S.assets||!S.dbOk)return;
    var subj=U.subject.trim(),title=U.title.trim();
    if(!U.uni){say(false,"Choose your university first.");return}
    if(!U.college){say(false,SCH()?"Choose your stage or track.":"Choose your college or school.");return}
    if(!U.major){say(false,SCH()?"Choose your grade or major.":"Choose your major.");return}
    if(!U.year){say(false,SCH()?"Choose your semester.":"Choose your year.");return}
    if(!subj){say(false,"Enter the subject, for example the course name and code.");return}
    if(!picked){say(false,"Choose a file to upload.");return}
    if(!title){say(false,"Give the file a title so classmates can find it.");return}
    var btn=$("#go");btn.disabled=true;btn.textContent="Uploading…";$("#prog").hidden=false;$("#prog i").style.width="60%";
    try{
      var e=ext(picked.name),up=picked;
      if(U.cmp!==false&&window.__cmp){btn.textContent="Compressing…";try{up=await window.__cmp.run(picked)||picked}catch(x){up=picked}btn.textContent="Uploading…"}
      var a=await S.assets.upload(up,{type:OK_EXT[e]});
      await S.db.collection("files").add({title:title,uni:U.uni,college:U.college,major:U.major,year:U.year,subject:subj,kind:U.kind,description:U.desc.trim(),assetId:a.id,contentType:a.contentType,sizeBytes:a.sizeBytes,fileName:picked.name,uploaderId:S.me||"",createdAt:Date.now(),compressed:(up!==picked&&up.size<picked.size)?true:undefined,origBytes:(up!==picked&&up.size<picked.size)?picked.size:undefined});
      var okText="Shared. Classmates in "+U.major+", "+U.year+" can now find \""+title+"\" in the Library."+(up!==picked&&up.size<picked.size?" File size reduced from "+size(picked.size)+" to "+size(up.size)+".":"");
      picked=null;S.filter={uni:U.uni,college:U.college,major:U.major,year:U.year,subject:subj,kind:"",q:"",sort:"new"};U.title=U.subject=U.desc="";U.locked=false;
      saveLast("lib");S.msg=null;S.page="library";try{history.replaceState(null,"","#library")}catch(e){}render();window.scrollTo(0,0);
      showToast(okText)
    }catch(err){
      var c=err&&err.code,t="The upload did not finish. Try again in a moment.";
      if(c==="quota_exceeded"||c==="quota")t="The hub is out of storage space.";
      else if(c==="not_granted"||c==="invalid_argument"||c==="not_signed_in"||c==="42501")t="Please sign in to upload.";
      else if(c==="unsupported_type")t="This file type is not accepted. Use a PDF, image or text file.";
      say(false,t)
    }
  }
  function rid(fid){return String(fid+"_"+S.me).replace(/[^A-Za-z0-9_.~:@+-]/g,"_").slice(0,190)}
  function rmsg(fid,t){var m=document.querySelector('[data-rmsg="'+fid+'"]');if(m)m.textContent=t}
  async function saveReview(fid){
    var d=S.draft[fid];if(!S.db||!S.me||!d)return;
    if(!d.stars){rmsg(fid,"Pick 1 to 5 stars first.");return}
    rmsg(fid,"Saving…");
    try{await S.db.doc("ratings/"+rid(fid)).set({fileId:fid,userId:S.me,stars:d.stars,text:(d.text||"").trim().slice(0,500),at:Date.now()});delete S.draft[fid];relib()}
    catch(e){rmsg(fid,"Could not save ("+((e&&e.code)||"error")+"). Are you signed in?")}
  }
  async function delReview(fid){
    try{await S.db.doc("ratings/"+rid(fid)).delete();delete S.draft[fid];relib()}catch(e){rmsg(fid,"Could not remove.")}
  }
  function relib(){if(S.page==="library"){var l=$("#lib");if(l)l.innerHTML=libraryList()}else if(S.page==="home")render()}
  async function remove(id){
    var f=S.files.filter(function(x){return x.id===id})[0];if(!f)return;
    var btn=document.querySelector('[data-del="'+id+'"]');
    if(btn&&btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent="Click again to remove";setTimeout(function(){if(btn){btn.dataset.sure="";btn.textContent="Remove"}},4000);return}
    try{await S.db.doc("files/"+id).delete();try{await S.assets.delete(f.assetId)}catch(e){}}catch(e){if(btn)btn.textContent="Could not remove"}
  }

  document.addEventListener("input",function(e){var t=e.target;if(t.matches&&t.matches(".rv-text")){var f=t.getAttribute("data-rt");(S.draft[f]=S.draft[f]||{stars:0,text:""}).text=t.value}});
  document.addEventListener("focusout",function(e){if(e.target.matches&&e.target.matches(".rv-text")&&S.stale){S.stale=false;setTimeout(relib,0)}});
  function typing(){var a=document.activeElement;return !!(a&&a.classList&&a.classList.contains("rv-text"))}
  document.addEventListener("click",function(e){
    var t=e.target;
    if(t.closest("[data-cont]")){if(lastOk()){S.filter.q="";S.filter.kind="";stParse("lib",LAST.p.slice(SCH()?0:0));S.libFiles=false;if(LAST.p.length>(SCH()?3:4)){}}
      stGo("lib");return}
    var st=t.closest("[data-st]");if(st){stPick(st);return}
    var sb=t.closest("[data-sb]");if(sb){var kk=sb.getAttribute("data-k");stClear(kk,+sb.getAttribute("data-sb"));stGo(kk);return}
    var ad=t.closest("[data-adv]");if(ad){var ap=ad.getAttribute("data-adv").split(":");if(ap[0]==="lib")S.adv=ap[1]==="1";else U.adv=ap[1]==="1";render();window.scrollTo(0,0);return}
    var g=t.closest("[data-go]");if(g){if(g.getAttribute("data-go")==="upload")U.locked=false;go(g.getAttribute("data-go"));return}
    var sg=t.closest("[data-stage]");if(sg){S.filter={uni:"school",college:sg.getAttribute("data-stage"),major:"",year:"",subject:"",kind:"",q:"",sort:"new"};S.libFiles=false;stGo("lib");return}
    var un=t.closest("[data-uni]");if(un){S.filter={uni:un.getAttribute("data-uni"),college:"",major:"",year:"",subject:"",kind:"",q:"",sort:"new"};S.libFiles=false;stGo("lib");return}
    var mu=t.closest("[data-mu]");if(mu){S.majorsUni=mu.getAttribute("data-mu");render();return}
    var mj=t.closest("[data-major]");if(mj){S.filter={uni:mj.getAttribute("data-u"),college:collegeOf(mj.getAttribute("data-u"),mj.getAttribute("data-major")),major:mj.getAttribute("data-major"),year:"",subject:"",kind:"",q:"",sort:"new"};S.libFiles=false;stGo("lib");return}
    var pu=t.closest("[data-pu]");if(pu){var id=pu.getAttribute("data-pu");if(U.uni!==id){U.uni=id;U.college=U.major=U.year=U.subject="";U.other=false}render();return}
    if(t.closest("[data-unlock]")){U.locked=false;U.subject="";U.other=false;stGo("up");return}
    if(t.closest("[data-here]")){var F=S.filter;U.locked=true;U.uni=F.uni;U.college=F.college;U.major=F.major;U.year=F.year;U.subject=F.subject||"";U.other=false;stGo("up");return}
    var rv=t.closest("[data-rv]");if(rv){var i0=rv.getAttribute("data-rv");S.open[i0]=!S.open[i0];relib();return}
    var rs=t.closest("[data-rs]");if(rs){var p=rs.getAttribute("data-rs").split(":");(S.draft[p[0]]=S.draft[p[0]]||{stars:0,text:""}).stars=+p[1];relib();return}
    var sv=t.closest("[data-rsave]");if(sv){saveReview(sv.getAttribute("data-rsave"));return}
    var dl=t.closest("[data-rdel]");if(dl){delReview(dl.getAttribute("data-rdel"));return}
    var d=t.closest("[data-del]");if(d){remove(d.getAttribute("data-del"))}
  });

  async function loadNames(){
    if(!S.user||!S.user.profiles)return;
    var ids=[],seen={};var add=function(u){if(u&&!seen[u]&&!S.names[u]){seen[u]=1;ids.push(u)}};S.files.forEach(function(f){add(f.uploaderId)});Object.keys(S.ratings).forEach(function(k){Object.keys(S.ratings[k]).forEach(add)});
    if(!ids.length)return;
    try{var ps=await S.user.profiles(ids);ids.forEach(function(i){var n=ps[i]&&ps[i].name;if(n)S.names[i]=n});if(typing())S.stale=true;else refreshData()}catch(e){}
  }
  async function init(){
    window.__sh={relib:relib,fileRow:fileRow,setLast:function(o){LAST=o},U:U,render:render,go:go,stGo:stGo,UNIS:UNIS,COURSES:COURSES,S:S};
    var h="";try{h=(location.hash||"").slice(1)}catch(e){}
    var hp=hashParts();if(PAGES.some(function(p){return p[0]===hp[0]}))S.page=hp[0];
    applyLevel();mountSwitch();if(!LEVEL)showGate();
    if(LEVEL&&(hp[0]==="library"||hp[0]==="upload"))stParse(hp[0]==="upload"?"up":"lib",hp.slice(1));
    render();
    try{
      var c=window.claude;if(!c||!c.use){S.loaded=true;S.dbOk=false;render();return}
      S.user=await c.use("user");
      if(S.user){try{S.me=await S.user.id()}catch(e){}try{S.canEdit=!!S.user.canEdit()}catch(e){}}
      S.assets=await c.use("assets");
      S.db=await c.use("db");
      if(!S.db){S.loaded=true;S.dbOk=false;render();return}
      S.dbOk=true;
      try{S.db.collection("ratings").limit(1000).onSnapshot(function(snap){
        var m={};snap.docs.forEach(function(d){var o=d.data()||{};if(o.fileId&&o.userId&&o.stars>=1&&o.stars<=5){(m[o.fileId]=m[o.fileId]||{})[o.userId]={stars:o.stars,text:o.text||"",at:o.at||0}}});
        S.ratings=m;if(S.loaded){if(typing())S.stale=true;else relib()}loadNames()
      },function(){})}catch(e){}
      S.db.collection("files").orderBy("createdAt","desc").limit(500).onSnapshot(function(snap){
        S.files=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
        S.loaded=true;if(typing())S.stale=true;else refreshData();loadNames()
      },function(){S.loaded=true;S.dbOk=false;refreshData()})
    }catch(e){S.loaded=true;S.dbOk=false;render()}
  }
  init()
})();
</script>

<script>
/* Phase 1: theme toggle, favourites, My library, lazy first-page thumbnails, install prompt, offline notice, service worker */
(function(){
  var X=window.__pdfx||{},SH=function(){return window.__sh},doc=document;
  function lg(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function ls(k,v){try{if(v===null||v===undefined)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function ago(t){var d=(Date.now()-t)/1000;if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+" min ago";if(d<86400)return Math.floor(d/3600)+" h ago";if(d<2592000)return Math.floor(d/86400)+" d ago";return new Date(t).toLocaleDateString()}

  /* ---------- theme ---------- */
  var MODES=["auto","light","dark"],LABEL={auto:"Auto",light:"Light",dark:"Dark"},ICON={auto:"◐",light:"☀",dark:"☾"};
  function themeGet(){var m=lg("sh_theme");return MODES.indexOf(m)>-1?m:"auto"}
  function themeApply(m){
    var r=doc.documentElement;if(m==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",m);
    var dark=m==="dark"||(m==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
    var tc=doc.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content",dark?"#0f1218":"#f6f7f9");
    var b=doc.getElementById("themebtn");if(b){b.innerHTML='<span aria-hidden="true">'+ICON[m]+'</span> <span>'+LABEL[m]+'</span>';b.setAttribute("aria-label","Colour theme: "+LABEL[m]+". Tap to change.")}
  }
  function mountTheme(){
    var bar=doc.querySelector(".bar");if(!bar||doc.getElementById("themebtn"))return;
    var b=doc.createElement("button");b.id="themebtn";b.type="button";b.className="btn small";
    b.onclick=function(){var m=MODES[(MODES.indexOf(themeGet())+1)%3];ls("sh_theme",m);themeApply(m)};
    bar.appendChild(b);themeApply(themeGet())
  }
  if(window.matchMedia)try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){themeApply(themeGet())})}catch(e){}

  /* ---------- favourites ---------- */
  function favs(){return lg("sh_fav")||{}}
  function isFav(id){return !!favs()[id]}
  function metaPut(f){if(!f||!f.id)return;var m=lg("sh_meta")||{};m[f.id]=f;var k=Object.keys(m);if(k.length>150){k.sort(function(a,b){return (m[a].createdAt||0)-(m[b].createdAt||0)});k.slice(0,k.length-150).forEach(function(x){delete m[x]})}ls("sh_meta",m)}
  function fileById(id){var S=SH()&&SH().S,f=S&&S.files.filter(function(x){return x.id===id})[0];return f||(lg("sh_meta")||{})[id]||null}
  function toggleFav(id){
    var m=favs(),on=!m[id];if(on){m[id]=Date.now();metaPut(fileById(id))}else{delete m[id];var dl=lg("sh_favdel")||{};dl[id]=Date.now();ls("sh_favdel",dl)}ls("sh_fav",m);
    [].forEach.call(doc.querySelectorAll('[data-fav]'),function(b){if(b.getAttribute("data-fav")===id)favPaint(b,on)});

    })

  function popToggle(){
    var el=doc.getElementById("pdfv");if(!el)return;var p=el.querySelector("#pmpop"),b=el.querySelector("[data-pfocus]");
    if(p){p.remove();if(b)b.setAttribute("aria-expanded","false");return}

  }

  /* ---------- share a page ---------- */
  var AC=["#ffd400","#4cd98a","#ff7eb6","#4da3ff"];
  function r4(x){x=+x;return isFinite(x)?Math.round(x*10000)/10000:0}
  function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))}
  function pageAnn(v){
    return (v.ann||[]).filter(function(a){return !a.del&&a.p===v.cur&&(a.k==="h"||a.k==="n")})
  }
  function shareUrl(v,withAnn){
    var u=location.origin+location.pathname+"#pdf="+encodeURIComponent(v.id)+"&p="+v.cur;
    if(withAnn){
      var items=[],len=0;
      pageAnn(v).forEach(function(a){
        var c=Math.max(0,AC.indexOf(a.c)),it=a.k==="h"?[0,r4(a.x),r4(a.y),r4(a.w),r4(a.h),c]:[1,r4(a.x),r4(a.y),c,String(a.tx||"").slice(0,300)];
        var l=JSON.stringify(it).length;if(len+l<1200&&items.length<25){items.push(it);len+=l}
      });

  }
  function shareDlg(){
    var v=X.state&&X.state();if(!v||!v.doc)return;

      (n?'<label class="sh-chk"><input type="checkbox" checked> <span>Include my highlights and notes on this page</span> <em>('+n+')</em></label>':'')+
      '<input type="text" class="sh-url" readonly aria-label="Share link"><div class="sh-act"><button type="button" class="btn primary" data-sh="copy">Copy link</button>'+(navigator.share?'<button type="button" class="btn" data-sh="native">Share…</button>':'')+'<button type="button" class="btn" data-sh="close">Close</button></div><p class="sh-msg" role="status"></p>';
    d.querySelector("b").textContent=v.cur;
    var inp=d.querySelector(".sh-url"),chk=d.querySelector("input[type=checkbox]"),msg=d.querySelector(".sh-msg");
    function upd(){inp.value=shareUrl(v,!!(chk&&chk.checked))}

    d.addEventListener("click",function(e){

      if(a==="close"){d.close();return}

        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(inp.value).then(function(){msg.textContent="Link copied."},function(){msg.textContent=ok?"Link copied.":"Press and hold the link to copy it."});
        else msg.textContent=ok?"Link copied.":"Press and hold the link to copy it."}
      if(a==="native"){navigator.share({title:"Study Hub",text:"Page "+v.cur+" on Study Hub",url:inp.value}).catch(function(){})}
    });
    d.addEventListener("close",function(){d.remove()});
    (doc.getElementById("pdfv")||doc.body).appendChild(d);d.showModal()
  }
  function applyShared(ann,page){
    var v=X.state&&X.state();if(!v||!v.doc||!ann||!ann.length)return;
    var made=[];
    ann.forEach(function(it){
      if(!Array.isArray(it))return;var o=null;
      if(it[0]===0&&it.length>=6)o={k:"h",p:page,x:r4(it[1]),y:r4(it[2]),w:r4(it[3]),h:r4(it[4]),c:AC[it[5]|0]||AC[0]};
      else if(it[0]===1&&it.length>=5&&it[4])o={k:"n",p:page,x:r4(it[1]),y:r4(it[2]),c:AC[it[3]|0]||AC[0],tx:String(it[4]).slice(0,500)};
      if(o){var a=X.annNew(v,o);if(a)made.push(a)}
    });
    if(!made.length)return;
    X.annRefresh(v,page);
    var t=doc.createElement("div");t.className="pvtoast";t.innerHTML='<span></span> <button type="button" class="btn" data-sundo="1">Undo</button>';
    t.querySelector("span").textContent="A classmate shared "+made.length+(made.length===1?" highlight or note":" highlights and notes")+" on this page.";
    t.querySelector("button").onclick=function(){made.forEach(function(a){X.annDel(v,a)});X.annRefresh(v,page);t.remove()};
    v.el.appendChild(t);setTimeout(function(){t.remove()},9000)
  }
  function openShared(id,page,ann){
    var tries=0;
    (function go(){
      var S=SH()&&SH().S;
      if(!S||(!S.loaded&&tries++<80)){setTimeout(go,150);return}
      var a=doc.createElement("a");a.href="/_blob/"+id;a.style.display="none";doc.body.appendChild(a);a.click();a.remove();
      var n=0;(function wait(){
        var v=X.state&&X.state();
        if(v&&v.doc&&v.els&&v.els.length&&v.id===id){
          var tt=v.el.querySelector(".pvtoast");if(tt)tt.hidden=true;
          setTimeout(function(){if(X.state()!==v)return;X.goPage(v,Math.min(Math.max(1,page),v.doc.numPages));applyShared(ann,Math.min(Math.max(1,page),v.doc.numPages))},350);return}
        if(n++<100)setTimeout(wait,150)
      })()
    })()
  }
  function checkHash(){
    var h=location.hash||"";if(h.indexOf("#pdf=")!==0)return;
    var p;try{p=new URLSearchParams(h.slice(1))}catch(e){return}
    var id=p.get("pdf"),page=parseInt(p.get("p"),10)||1,ann=null;
    if(!id||!/\.pdf$/i.test(id))return;
    try{if(p.get("a"))ann=JSON.parse(b64d(p.get("a")))}catch(e){ann=null}
    try{history.replaceState(null,"","#home")}catch(e){}
    openShared(id,page,ann)
  }
  window.addEventListener("hashchange",checkHash);
  doc.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&e.target.closest&&e.target.closest("[data-pm-cf],[data-pm-cb]")){e.preventDefault();e.stopPropagation();pact("setcustom")}
  },true);

  /* ---------- clicks ---------- */
  doc.addEventListener("click",function(e){
    var t=e.target,b;if(!t.closest)return;
    if(b=t.closest("[data-pm]")){e.preventDefault();pact(b.getAttribute("data-pm"));return}
    if(t.closest("[data-pfocus]")){popToggle();return}
    if(t.closest("[data-pshare]")){shareDlg();return}
  });

  /* ---------- go ---------- */
  wrapMine();pill();chip();checkHash()
})();
</script>
<script>
/* Phase 3: study sets (flashcards + quiz) written by Claude during PDF review */
(function(){
  var doc=document,X=window.__pdfx||{},SH=function(){return window.__sh},sb=window.__sb;
  function lg(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function ls(k,v){try{if(v===null||v===undefined)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  var have={};
  var api={
    have:have,
    fetch:function(id){
      if(!sb)return Promise.reject();
      return sb.from("file_study").select("cards,quiz").eq("file_id",id).maybeSingle().then(function(r){if(r.error)throw r.error;return r.data})
    }
  };
  window.__studyx=api;

  /* which files have a study set */
  function repaint(){
    var h=SH();if(!h)return;var S=h.S;
    if(S.page==="library")h.relib();else if(S.page==="home"||S.page==="mine")h.render()
  }
  function loadIds(){
    var h=SH();if(!h||!sb){setTimeout(loadIds,400);return}
    h.S.study=have;
    sb.from("file_study").select("file_id").then(function(r){
      if(r.error||!r.data)return;
      r.data.forEach(function(x){have[x.file_id]=1});
      repaint();decorateNow()
    },function(){})
  }
  function fileById(id){var S=SH()&&SH().S;return S&&S.files.filter(function(f){return f.id===id})[0]||null}
  function fileByAsset(a){var S=SH()&&SH().S;return S&&S.files.filter(function(f){return f.assetId===a})[0]||null}

  /* viewer button */
  function decorateNow(){var el=doc.getElementById("pdfv");if(el)decorate(el)}
  function decorate(el){
    var v=X.state&&X.state();if(!v)return;
    var f=fileByAsset(v.id);if(!f||!have[f.id])return;
    var tools=el.querySelector(".pvtools");if(!tools||tools.querySelector("[data-pstudy]"))return;
    var b=doc.createElement("button");b.type="button";b.className="btn";b.setAttribute("data-pdoc","1");b.setAttribute("data-pstudy",f.id);b.textContent="Study";
    var dl=tools.querySelector("[data-pdl]");tools.insertBefore(b,dl)
  }
  if(window.MutationObserver)new MutationObserver(function(){var el=doc.getElementById("pdfv");if(el)setTimeout(function(){decorate(el)},0)}).observe(doc.body,{childList:true});

  /* ---------- dialog ---------- */
  var D=null,set=null,fid=null,tab="cards";
  var cs={i:0,flip:false,order:[],mode:"all"},qs={order:[],i:0,score:0,done:false,picked:-1,wrong:[],round:0};
  function prog(){var m=lg("sh_cards")||{};return m[fid]||{known:{}}}
  function progSave(p){var m=lg("sh_cards")||{};p.t=Date.now();m[fid]=p;var k=Object.keys(m);if(k.length>80){k.sort(function(a,b){return m[a].t-m[b].t});k.slice(0,k.length-80).forEach(function(x){delete m[x]})}ls("sh_cards",m)}
  function qbest(){var m=lg("sh_quiz")||{};return m[fid]||null}
  function qsave(sc,tot){var m=lg("sh_quiz")||{},o=m[fid]||{best:0};o.last=sc;o.total=tot;if(sc>=(o.best||0))o.best=sc;o.t=Date.now();m[fid]=o;ls("sh_quiz",m)}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function cards(){return Array.isArray(set&&set.cards)?set.cards.filter(function(c){return c&&c.q&&c.a}):[]}
  function quiz(){return Array.isArray(set&&set.quiz)?set.quiz.filter(function(q){return q&&q.q&&Array.isArray(q.o)&&q.o.length>=2&&q.a>=0&&q.a<q.o.length}):[]}
  function buildOrder(){
    var p=prog(),all=cards().map(function(_,i){return i});
    cs.order=cs.mode==="left"?all.filter(function(i){return !p.known[i]}):all;cs.i=0;cs.flip=false
  }
  function open(id){
    fid=id;var f=fileById(id);
    if(D)D.remove();
    D=doc.createElement("dialog");D.id="scdlg";D.setAttribute("aria-labelledby","sc-t");
    D.innerHTML='<div class="sc-h"><h2 id="sc-t"></h2><button type="button" class="btn small" data-sc="close">Close</button></div><div class="sc-body"><p class="sc-load">Loading…</p></div>';
    D.querySelector("#sc-t").textContent=(f&&f.title)||"Study";
    D.addEventListener("click",onClick);D.addEventListener("keydown",onKey);
    D.addEventListener("close",function(){D.remove();D=null});
    doc.body.appendChild(D);D.showModal();
    api.fetch(id).then(function(r){
      set=r;cs.mode="all";cs.i=0;cs.flip=false;buildOrder();qs={order:[],i:0,score:0,done:false,picked:-1,wrong:[],round:0};
      tab=cards().length?"cards":"quiz";if(!cards().length&&!quiz().length){body('<p class="sc-load">No study set for this file yet.</p>');return}
      render()
    },function(){body('<p class="sc-load">Could not load the study set. Check your connection and try again.</p>')})
  }
  function body(h){if(D)D.querySelector(".sc-body").innerHTML=h}
  function render(){
    if(!D)return;var C=cards(),Q=quiz();
    var tabs='<div class="sc-tabs" role="tablist">'+(C.length?'<button type="button" role="tab" aria-selected="'+(tab==="cards")+'" data-sc="tab:cards"><span>Flashcards</span> <em>'+C.length+'</em></button>':'')+(Q.length?'<button type="button" role="tab" aria-selected="'+(tab==="quiz")+'" data-sc="tab:quiz"><span>Quiz</span> <em>'+Q.length+'</em></button>':'')+'</div>';
    body(tabs+(tab==="cards"?cardsHtml():quizHtml()));
    var f=D.querySelector("[data-sc-focus]");if(f)f.focus()
  }
  function cardsHtml(){
    var C=cards(),p=prog(),known=Object.keys(p.known).filter(function(k){return +k<C.length}).length;
    if(!cs.order.length){
      return'<div class="sc-done"><b>All cards learned</b><p>You marked every card as known. Nice work.</p><div class="sc-act"><button type="button" class="btn primary" data-sc="reset" data-sc-focus="1">Start over</button></div></div>'
    }
    var c=C[cs.order[cs.i]];
    return'<div class="sc-meta"><span><span>Card</span> <b>'+(cs.i+1)+'</b> / '+cs.order.length+'</span><span><b>'+known+'</b> <span>known</span></span><label class="sc-mode"><input type="checkbox" data-sc="mode"'+(cs.mode==="left"?" checked":"")+'> <span>Only cards I am still learning</span></label></div>'+
      '<button type="button" class="sc-card'+(cs.flip?" back":"")+'" data-sc="flip" data-sc-focus="1" aria-label="Flip card"><span class="sc-side">'+(cs.flip?"Answer":"Question")+'</span><span class="sc-txt" dir="auto">'+esc(cs.flip?c.a:c.q)+'</span><span class="sc-hint">Tap the card to flip it</span></button>'+
      '<div class="sc-act"><button type="button" class="btn" data-sc="prev">Previous</button>'+(cs.flip?'<button type="button" class="btn" data-sc="again">Still learning</button><button type="button" class="btn primary" data-sc="know">I know it</button>':'')+'<button type="button" class="btn" data-sc="next">Next</button><button type="button" class="btn small" data-sc="shuffle">Shuffle</button></div>'
  }
  function quizHtml(){
    var Q=quiz();
    if(!qs.order.length&&!qs.done){qs.order=shuffle(Q.map(function(_,i){return i}));qs.i=0;qs.score=0;qs.picked=-1;qs.wrong=[];qs.round=qs.round||0}
    if(qs.done){
      var b=qbest();
      return'<div class="sc-done"><b><span>Your score</span> '+qs.score+' / '+qs.order.length+'</b><p>'+(b?'<span>Best</span> '+b.best+' / '+b.total:'')+'</p><div class="sc-act">'+(qs.wrong.length?'<button type="button" class="btn" data-sc="qwrong" data-sc-focus="1">Try the ones I missed</button>':'')+'<button type="button" class="btn primary" data-sc="qagain"'+(qs.wrong.length?'':' data-sc-focus="1"')+'>Retake the quiz</button></div></div>'
    }
    var q=Q[qs.order[qs.i]],ans=qs.picked>=0;
    var opts=q.o.map(function(o,i){
      var cls="sc-opt";if(ans){if(i===q.a)cls+=" ok";else if(i===qs.picked)cls+=" bad"}
      return'<button type="button" class="'+cls+'" data-sc="pick:'+i+'"'+(ans?" disabled":"")+' dir="auto"><b>'+"ABCDEFGH".charAt(i)+'</b><span>'+esc(o)+'</span></button>'
    }).join("");
    return'<div class="sc-meta"><span><span>Question</span> <b>'+(qs.i+1)+'</b> / '+qs.order.length+'</span><span><span>Score</span> <b>'+qs.score+'</b></span></div><p class="sc-q" dir="auto">'+esc(q.q)+'</p><div class="sc-opts" role="group" aria-label="Answers">'+opts+'</div>'+
      (ans?'<p class="sc-fb" role="status"><b>'+(qs.picked===q.a?"Correct!":"Not quite.")+'</b> '+(q.e?'<span dir="auto">'+esc(q.e)+'</span>':'')+'</p><div class="sc-act"><button type="button" class="btn primary" data-sc="qnext" data-sc-focus="1">'+(qs.i+1>=qs.order.length?"See score":"Next question")+'</button></div>':'')
  }
  function mark(known){
    var C=cards(),p=prog(),idx=cs.order[cs.i];
    if(known)p.known[idx]=1;else delete p.known[idx];progSave(p);
    if(cs.mode==="left"&&known){cs.order.splice(cs.i,1);if(cs.i>=cs.order.length)cs.i=0}else cs.i=(cs.i+1)%cs.order.length;
    cs.flip=false;render()
  }
  function onClick(e){
    var b=e.target.closest&&e.target.closest("[data-sc]");if(!b)return;var a=b.getAttribute("data-sc");
    if(a==="close"){D.close();return}
    if(a.indexOf("tab:")===0){tab=a.slice(4);render();return}
    if(a==="flip"){cs.flip=!cs.flip;render();return}
    if(a==="next"){cs.i=(cs.i+1)%cs.order.length;cs.flip=false;render();return}
    if(a==="prev"){cs.i=(cs.i-1+cs.order.length)%cs.order.length;cs.flip=false;render();return}
    if(a==="know"){mark(true);return}
    if(a==="again"){mark(false);return}
    if(a==="shuffle"){shuffle(cs.order);cs.i=0;cs.flip=false;render();return}
    if(a==="mode"){cs.mode=b.checked?"left":"all";buildOrder();render();return}
    if(a==="reset"){progSave({known:{}});cs.mode="all";buildOrder();render();return}
    if(a.indexOf("pick:")===0){
      var q=quiz()[qs.order[qs.i]],i=+a.slice(5);qs.picked=i;
      if(i===q.a)qs.score++;else qs.wrong.push(qs.order[qs.i]);
      render();return}
    if(a==="qnext"){
      if(qs.i+1>=qs.order.length){qs.done=true;if(!qs.round)qsave(qs.score,qs.order.length)}else{qs.i++;qs.picked=-1}
      render();return}
    if(a==="qagain"){qs={order:[],i:0,score:0,done:false,picked:-1,wrong:[],round:0};render();return}
    if(a==="qwrong"){var w=qs.wrong.slice();qs={order:shuffle(w),i:0,score:0,done:false,picked:-1,wrong:[],round:1};render();return}
  }
  function onKey(e){
    if(tab!=="cards"||!cs.order.length||e.target.tagName==="INPUT")return;
    if(e.key===" "||e.key==="Enter"){if(e.target.closest&&e.target.closest("[data-sc=flip]")){return}}
    if(e.key==="ArrowRight"){e.preventDefault();cs.i=(cs.i+1)%cs.order.length;cs.flip=false;render()}
    else if(e.key==="ArrowLeft"){e.preventDefault();cs.i=(cs.i-1+cs.order.length)%cs.order.length;cs.flip=false;render()}
  }
  doc.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-study],[data-pstudy]");if(!b)return;
    e.preventDefault();open(b.getAttribute("data-study")||b.getAttribute("data-pstudy"))
  });
  loadIds()
})();
</script>

/* Upload compression: shrinks big scanned PDFs and photos in the browser before they are uploaded. Falls back to the original file on any problem. */
(function(){
  var doc=document,MIN=400*1024,MAXPX=1800,QP=0.65,MAXIMG=2200,QI=0.82,BUDGET=30000;
  var URLS=["https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js","https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js","https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"];
  function loadScript(u){return new Promise(function(ok,no){var s=doc.createElement("script");s.src=u;s.async=true;s.onload=ok;s.onerror=function(){s.remove();no()};doc.head.appendChild(s)})}
  function loadLib(){
    if(window.PDFLib)return Promise.resolve(window.PDFLib);
    var p=Promise.reject();URLS.forEach(function(u){p=p.catch(function(){return loadScript(u).then(function(){if(!window.PDFLib)throw 0})})});
    return p.then(function(){return window.PDFLib})
  }
  function toBlob(cv,type,q){return new Promise(function(res){cv.toBlob(res,type,q)})}
  function draw(bmp,nw,nh){var cv=doc.createElement("canvas");cv.width=nw;cv.height=nh;var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,nw,nh);cx.drawImage(bmp,0,0,nw,nh);return cv}
  function ext(n){return (n.split(".").pop()||"").toLowerCase()}

  /* photos: png, jpg, webp */
  async function shrinkImage(file){
    var e=ext(file.name),type=e==="png"?"image/png":e==="webp"?"image/webp":"image/jpeg";
    var bmp=await createImageBitmap(file);
    var w=bmp.width,h=bmp.height,sc=Math.min(1,MAXIMG/Math.max(w,h));
    if(type==="image/png"&&sc>=1){bmp.close&&bmp.close();return file}
    var nw=Math.max(1,Math.round(w*sc)),nh=Math.max(1,Math.round(h*sc));
    var cv=type==="image/png"?(function(){var c=doc.createElement("canvas");c.width=nw;c.height=nh;c.getContext("2d").drawImage(bmp,0,0,nw,nh);return c})():draw(bmp,nw,nh);
    bmp.close&&bmp.close();
    var b=await toBlob(cv,type,QI);
    if(b&&b.size<file.size*0.9)return new File([b],file.name,{type:type});
    return file
  }

  /* pdf: re-encode big pictures (JPEG or lossless Flate), then re-save compactly */
  function ncomp(L,N,d){
    var cs=d.get(N("ColorSpace"));
    if(cs===N("DeviceRGB"))return 3;if(cs===N("DeviceGray"))return 1;
    if(cs instanceof L.PDFArray&&cs.size()===2&&cs.lookup(0)===N("ICCBased")){var ic=cs.lookup(1);var n=ic&&ic.dict&&ic.dict.get(N("N"));var v=n&&n.asNumber?n.asNumber():0;return v===3||v===1?v:0}
    return 0
  }
  function num(x){return x&&x.asNumber?x.asNumber():0}
  async function shrinkPdf(file){
    var L=await loadLib(),P=L.PDFDocument,N=function(x){return L.PDFName.of(x)},deadline=Date.now()+BUDGET;
    var pdf=await P.load(await file.arrayBuffer(),{updateMetadata:false});
    var objs=pdf.context.enumerateIndirectObjects();
    for(var i=0;i<objs.length;i++){
      if(Date.now()>deadline)break;
      var o=objs[i][1];
      if(!(o instanceof L.PDFRawStream))continue;
      var d=o.dict;
      if(d.get(N("Subtype"))!==N("Image"))continue;
      var fl=d.get(N("Filter"));if(fl instanceof L.PDFArray&&fl.size()===1)fl=fl.lookup(0);
      var isJpg=fl===N("DCTDecode"),isFlate=fl===N("FlateDecode");
      if(!isJpg&&!isFlate)continue;
      var im=d.get(N("ImageMask"));if(im&&im!==L.PDFBool.False)continue;
      if(d.get(N("Decode"))||d.get(N("Mask")))continue;
      var bytes=o.contents;if(!bytes||bytes.length<(isJpg?60:120)*1024)continue;
      var nc=ncomp(L,N,d);if(isFlate&&!nc)continue;
      if(isJpg&&d.get(N("ColorSpace"))===N("DeviceCMYK"))continue;
      if(isJpg&&nc===0&&d.get(N("ColorSpace"))instanceof L.PDFArray)continue;
      try{
        var bmp,sw=num(d.get(N("Width"))),sh=num(d.get(N("Height")));
        if(isJpg){bmp=await createImageBitmap(new Blob([bytes],{type:"image/jpeg"}),{imageOrientation:"none"})}
        else{
          if(num(d.get(N("BitsPerComponent")))!==8||!sw||!sh)continue;
          var raw=L.decodePDFRawStream(o).decode();
          if(!raw||raw.length<sw*sh*nc)continue;
          var rgba=new Uint8ClampedArray(sw*sh*4),k=0,m=0,px=sw*sh;
          if(nc===3){for(;k<px;k++){rgba[m++]=raw[k*3];rgba[m++]=raw[k*3+1];rgba[m++]=raw[k*3+2];rgba[m++]=255}}
          else{for(;k<px;k++){var g=raw[k];rgba[m++]=g;rgba[m++]=g;rgba[m++]=g;rgba[m++]=255}}
          bmp=await createImageBitmap(new ImageData(rgba,sw,sh))
        }
        var w=bmp.width,h=bmp.height,sc=Math.min(1,MAXPX/Math.max(w,h)),nw=Math.max(1,Math.round(w*sc)),nh=Math.max(1,Math.round(h*sc));
        var b=await toBlob(draw(bmp,nw,nh),"image/jpeg",QP);bmp.close&&bmp.close();
        if(!b||b.size>bytes.length*(isJpg?0.85:0.6))continue;
        o.contents=new Uint8Array(await b.arrayBuffer());
        d.set(N("Filter"),N("DCTDecode"));
        d.set(N("Width"),L.PDFNumber.of(nw));d.set(N("Height"),L.PDFNumber.of(nh));
        d.set(N("ColorSpace"),N("DeviceRGB"));d.set(N("BitsPerComponent"),L.PDFNumber.of(8));d.delete(N("DecodeParms"));
      }catch(x){}
    }
    var out=await pdf.save({useObjectStreams:true});
    var chk=await P.load(out,{updateMetadata:false});
    if(chk.getPageCount()!==pdf.getPageCount())return file;
    if(out.length<file.size*0.92)return new File([out],file.name,{type:"application/pdf"});
    return file
  }

  window.__cmp={
    run:async function(file,opt){
      try{
        if(!file||file.size<((opt&&opt.min)||MIN))return file;
        var e=ext(file.name);
        if(e==="pdf")return await shrinkPdf(file);
        if(e==="png"||e==="jpg"||e==="jpeg"||e==="webp")return await shrinkImage(file)
      }catch(x){}
      return file
    }
  }
})();
</script>
